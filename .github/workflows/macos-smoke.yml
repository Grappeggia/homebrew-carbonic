name: Public Carbonic cask smoke
on:
  workflow_dispatch:
  push:
    paths: ['Casks/**', '.github/workflows/macos-smoke.yml', '.github/scripts/**', 'install.sh']
permissions:
  contents: read
concurrency:
  group: public-carbonic-macos-smoke-${{ github.ref }}
  cancel-in-progress: false
jobs:
  install-public-cask:
    strategy:
      fail-fast: false
      matrix:
        # Apple silicon is the supported Homebrew platform. The Intel runner has a
        # preinstalled Homebrew (Tier 3, unsupported by Homebrew) and shows whether
        # existing Intel installations can still install the universal cask.
        runner: [macos-15, macos-15-intel]
        brew_update: [false]
        include:
          # Real Intel users auto-update to the current (Tier 3 on Intel) Homebrew.
          - runner: macos-15-intel
            brew_update: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_ANALYTICS: '1'
      HOMEBREW_NO_INSTALL_FROM_API: '1'
      HOMEBREW_CACHE: ${{ github.workspace }}/build/cache
      HOMEBREW_LOGS: ${{ github.workspace }}/build/logs
      HOMEBREW_TEMP: ${{ github.workspace }}/build/tmp
      TMPDIR: ${{ github.workspace }}/build/tmp
      TMP: ${{ github.workspace }}/build/tmp
      TEMP: ${{ github.workspace }}/build/tmp
      XDG_CACHE_HOME: ${{ github.workspace }}/build/cache
      XDG_CONFIG_HOME: ${{ github.workspace }}/build/config
      BREW_UPDATE: ${{ matrix.brew_update }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install the public tap and verify the actual payload
        shell: bash
        # Step bound below the job bound so the evidence upload still runs on a hang.
        timeout-minutes: 40
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/build/evidence"
          APPDIR="$GITHUB_WORKSPACE/build/Applications"
          TOKEN=grappeggia/carbonic/carbonic
          mkdir -p "$OUT" "$APPDIR" "$TMPDIR" "$HOMEBREW_CACHE"
          exec 9>>"$OUT/trace.log"
          BASH_XTRACEFD=9
          PS4='+ $(date -u +%H:%M:%S) '
          set -x
          uname -m > "$OUT/host-arch.txt"
          command -v brew > "$OUT/brew-path.txt"
          if [ "$BREW_UPDATE" = true ]; then
            HOMEBREW_NO_AUTO_UPDATE= brew update > "$OUT/brew-update.txt" 2>&1
          fi
          cleanup() {
            result=$?
            trap - EXIT
            if brew list --cask carbonic >/dev/null 2>&1; then
              brew uninstall --cask "$TOKEN" >> "$OUT/cleanup.log" 2>&1 || { if [ "$result" -eq 0 ]; then result=1; fi; }
            fi
            exit "$result"
          }
          trap cleanup EXIT
          brew --version | tee "$OUT/brew-version.txt"
          brew tap grappeggia/carbonic
          brew style --cask "$TOKEN" 2>&1 | tee "$OUT/style.txt"
          brew trust --cask "$TOKEN" 2>&1 | tee "$OUT/cask-trust.txt"
          brew trust --json=v1 > "$OUT/trust.json"
          brew audit --cask "$TOKEN" 2>&1 | tee "$OUT/audit.txt"
          brew info --cask --json=v2 "$TOKEN" > "$OUT/cask.json"
          curl --fail --location --retry 2 --max-time 120 https://github.com/Grappeggia/homebrew-carbonic/releases/download/v0.1.2-3/manifest.json --output "$OUT/manifest.json"
          curl --fail --location --retry 2 --max-time 180 https://github.com/Grappeggia/homebrew-carbonic/releases/download/v0.1.2-3/Carbonic-0.1.2-3-macos-universal2.zip --output "$OUT/Carbonic-0.1.2-3-macos-universal2.zip"
          python3 - "$OUT" <<'PY'
          import hashlib, json, pathlib, sys
          out = pathlib.Path(sys.argv[1])
          manifest = json.loads((out / 'manifest.json').read_text())
          trust = json.loads((out / 'trust.json').read_text())
          assert trust == dict(taps=[], formulae=[], casks=['grappeggia/carbonic/carbonic'], commands=[])
          asset = manifest['artifact']
          archive = out / asset['name']
          assert manifest['version'] == '0.1.2' and manifest['build'] == '3'
          assert manifest['source_commit'] == '941e32d72ccd1eed60884b1c2de34cbb0fc93ad3'
          assert asset['sha256'] == 'f522ea041f807a6c414155550fbf04609d6e2d6e873b5ce172b9a45ed3deae9c'
          assert archive.stat().st_size == asset['bytes']
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == asset['sha256']
          cask = json.loads((out / 'cask.json').read_text())['casks'][0]
          assert cask['version'] == '0.1.2,3' and cask['sha256'] == asset['sha256']
          assert cask['url'] == 'https://github.com/Grappeggia/homebrew-carbonic/releases/download/v0.1.2-3/' + asset['name']
          PY
          brew install --cask --appdir="$APPDIR" grappeggia/carbonic/carbonic 2>&1 | tee "$OUT/install.txt"
          APP="$APPDIR/Carbonic.app"
          python3 - "$APP" "$OUT" <<'PY'
          import json, pathlib, plistlib, subprocess, sys
          app, out = map(pathlib.Path, sys.argv[1:])
          info = plistlib.loads((app / 'Contents/Info.plist').read_bytes())
          for key, value in dict(CFBundleIdentifier='org.carbonic.carbonicapp', CFBundleName='Carbonic', CFBundleExecutable='Carbonic', CFBundleShortVersionString='0.1.2', CFBundleVersion='3', LSMinimumSystemVersion='14.0').items():
              assert info.get(key) == value, (key, info.get(key))
          inventory = {}
          magic = {bytes.fromhex(h) for h in ('cafebabe', 'cafebabf', 'bebafeca', 'bfbafeca', 'cffaedfe', 'cefaedfe', 'feedfacf', 'feedface')}
          for file in app.rglob('*'):
              if not file.is_file() or file.is_symlink():
                  continue
              with file.open('rb') as stream:
                  header = stream.read(4)
              if header in magic:
                  arches = sorted(subprocess.check_output(['lipo', '-archs', str(file)], text=True).split())
                  assert arches == ['arm64', 'x86_64'], (str(file), arches)
                  inventory['Carbonic.app/' + str(file.relative_to(app))] = arches
          manifest = json.loads((out / 'manifest.json').read_text())
          assert inventory == manifest['mach_o']
          (out / 'installed-native-inventory.json').write_text(json.dumps(inventory, indent=2) + '\n')
          PY
          codesign --verify --deep --strict --verbose=2 "$APP" > "$OUT/codesign-verify.txt" 2>&1
          codesign -d --verbose=4 "$APP" > "$OUT/codesign-details.txt" 2>&1
          grep -q 'Signature=adhoc' "$OUT/codesign-details.txt"
          xattr -p com.apple.quarantine "$APP" > "$OUT/quarantine.txt"
          set +e
          spctl --assess --type execute --verbose=4 "$APP" > "$OUT/gatekeeper.txt" 2>&1
          assessment=$?
          set -e
          printf '%s\n' "$assessment" > "$OUT/gatekeeper-exit.txt"
          test "$assessment" -ne 0
          grep -qi rejected "$OUT/gatekeeper.txt"
          bash "$GITHUB_WORKSPACE/.github/scripts/runtime-launch.sh" "$APP" "$OUT"
          brew upgrade --cask --appdir="$APPDIR" "$TOKEN" 2>&1 | tee "$OUT/upgrade-current.txt"
          brew uninstall --cask "$TOKEN" 2>&1 | tee "$OUT/uninstall.txt"
          test ! -e "$APP"
          printf '%s\n' 'PASS public download checksum, cask install, native identity/universal2/integrity/quarantine, expected Gatekeeper rejection, runtime launch, upgrade-current command, uninstall' > "$OUT/result.txt"
      - name: Retain bounded public installation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: carbonic-public-macos-smoke-${{ matrix.runner }}${{ matrix.brew_update && '-brew-updated' || '' }}
          path: build/evidence/
          retention-days: 30
          if-no-files-found: error

  direct-download:
    # README route for Intel Macs (and any Mac without Homebrew).
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-intel, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      TMPDIR: ${{ github.workspace }}/build/tmp
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Download, verify and install the latest release directly
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/build/evidence"
          DL="$GITHUB_WORKSPACE/build/download"
          APPDIR="$GITHUB_WORKSPACE/build/Applications"
          mkdir -p "$OUT" "$DL" "$APPDIR" "$TMPDIR"
          cd "$DL"
          BASE=https://github.com/Grappeggia/homebrew-carbonic/releases/latest/download
          for f in manifest.json SHA256SUMS; do
            curl --fail --location --retry 2 --max-time 120 "$BASE/$f" --output "$f"
          done
          ZIP=$(python3 -c "import json; print(json.load(open('manifest.json'))['artifact']['name'])")
          curl --fail --location --retry 2 --max-time 180 "$BASE/$ZIP" --output "$ZIP"
          shasum -a 256 -c SHA256SUMS | tee "$OUT/sha256sums-check.txt"
          python3 - "$ZIP" <<'PY'
          import hashlib, json, pathlib, sys
          manifest = json.loads(pathlib.Path('manifest.json').read_text())
          archive = pathlib.Path(sys.argv[1])
          assert manifest['artifact']['name'] == archive.name
          assert archive.stat().st_size == manifest['artifact']['bytes']
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == manifest['artifact']['sha256']
          assert manifest['architectures'] == ['arm64', 'x86_64']
          PY
          cp manifest.json "$OUT/manifest.json"
          # Same quarantine a browser download receives; ditto keeps it on extraction.
          xattr -w com.apple.quarantine "0083;$(printf %x "$(date +%s)");Safari;$(uuidgen)" "$ZIP"
          ditto -xk "$ZIP" "$APPDIR"
          APP="$APPDIR/Carbonic.app"
          xattr -p com.apple.quarantine "$APP" > "$OUT/quarantine.txt" 2>&1 || echo "not propagated by ditto" > "$OUT/quarantine.txt"
          codesign --verify --deep --strict --verbose=2 "$APP" > "$OUT/codesign-verify.txt" 2>&1
          codesign -d --verbose=4 "$APP" > "$OUT/codesign-details.txt" 2>&1
          grep -q 'Signature=adhoc' "$OUT/codesign-details.txt"
          codesign -d --entitlements - --xml "$APP" 2>/dev/null | plutil -p - > "$OUT/entitlements.txt"
          grep -q 'com.apple.security.app-sandbox" => true\|com.apple.security.app-sandbox" => 1' "$OUT/entitlements.txt"
          lipo -archs "$APP/Contents/MacOS/Carbonic" > "$OUT/archs.txt"
          grep -q x86_64 "$OUT/archs.txt"
          grep -q arm64 "$OUT/archs.txt"
          set +e
          spctl --assess --type execute --verbose=4 "$APP" > "$OUT/gatekeeper.txt" 2>&1
          assessment=$?
          set -e
          printf '%s\n' "$assessment" > "$OUT/gatekeeper-exit.txt"
          test "$assessment" -ne 0
          grep -qi rejected "$OUT/gatekeeper.txt"
          bash "$GITHUB_WORKSPACE/.github/scripts/runtime-launch.sh" "$APP" "$OUT"
          printf '%s\n' 'PASS direct download checksums/manifest, ad-hoc integrity, sandbox entitlement, universal2, expected Gatekeeper rejection, runtime launch' > "$OUT/result.txt"
      - name: Retain bounded direct-download evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: carbonic-direct-download-${{ matrix.runner }}
          path: build/evidence/
          retention-days: 30
          if-no-files-found: error

  install-script:
    # One-command installer documented for Macs without Homebrew (Intel).
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-intel, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      TMPDIR: ${{ github.workspace }}/build/tmp
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install with install.sh, verify, launch and uninstall
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/build/evidence"
          export CARBONIC_APPDIR="$GITHUB_WORKSPACE/build/Applications"
          export CARBONIC_TAP_REF="$GITHUB_SHA"
          mkdir -p "$OUT" "$TMPDIR"
          bash install.sh 2>&1 | tee "$OUT/install.txt"
          APP="$CARBONIC_APPDIR/Carbonic.app"
          xattr -p com.apple.quarantine "$APP" > "$OUT/quarantine.txt"
          codesign --verify --deep --strict --verbose=2 "$APP" > "$OUT/codesign-verify.txt" 2>&1
          SHA=$(sed -n 's/^  sha256 "\([0-9a-f]\{64\}\)"$/\1/p' Casks/carbonic.rb)
          grep -q "Checksum verified: $SHA" "$OUT/install.txt"
          set +e
          spctl --assess --type execute --verbose=4 "$APP" > "$OUT/gatekeeper.txt" 2>&1
          assessment=$?
          set -e
          test "$assessment" -ne 0
          bash "$GITHUB_WORKSPACE/.github/scripts/runtime-launch.sh" "$APP" "$OUT"
          # A tampered pin must be refused before anything is installed.
          sed 's/^  sha256 "[0-9a-f]*"$/  sha256 "'"$(printf '0%.0s' $(seq 1 64))"'"/' Casks/carbonic.rb > "$OUT/tampered.rb"
          mkdir -p "$TMPDIR/badtap/Casks" && cp "$OUT/tampered.rb" "$TMPDIR/badtap/Casks/carbonic.rb"
          set +e
          ( cd "$TMPDIR/badtap" && python3 -m http.server 8765 --bind 127.0.0.1 >/dev/null 2>&1 & echo $! > "$TMPDIR/srv.pid" )
          sleep 2
          sed 's#https://raw.githubusercontent.com/$REPO/$REF/Casks/carbonic.rb#http://127.0.0.1:8765/Casks/carbonic.rb#' install.sh > "$TMPDIR/install-badpin.sh"
          CARBONIC_APPDIR="$GITHUB_WORKSPACE/build/BadApplications" bash "$TMPDIR/install-badpin.sh" > "$OUT/tampered-install.txt" 2>&1
          bad=$?
          kill "$(cat "$TMPDIR/srv.pid")"
          set -e
          test "$bad" -ne 0
          grep -q "checksum mismatch" "$OUT/tampered-install.txt"
          test ! -e "$GITHUB_WORKSPACE/build/BadApplications/Carbonic.app"
          bash install.sh --uninstall | tee "$OUT/uninstall.txt"
          test ! -e "$APP"
          printf '%s\n' 'PASS install.sh pinned-checksum install, quarantine kept, integrity, expected Gatekeeper rejection, runtime launch, tampered pin refused, uninstall' > "$OUT/result.txt"
      - name: Retain bounded install-script evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: carbonic-install-script-${{ matrix.runner }}
          path: build/evidence/
          retention-days: 30
          if-no-files-found: error
